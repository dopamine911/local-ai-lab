# lab CLI config (issue #6). In git: no secrets. Secrets stay in the .env files (mode 600) and are read, never printed.
machines:
  zaphod:
    ssh: zaphod                 # ssh alias (from marvin); on zaphod itself commands run locally
    llama_swap_port: 8080
    llama_swap_container: llama-swap
    llama_swap_env: ~/llama-swap/.env   # ZAPHOD_KEY (read, never printed)
    image_card_pci: "0000:0b:00.0"      # card 2: lent to ComfyUI in image mode
  marvin:
    ssh: marvin
    llama_swap_port: 8080
    llama_swap_container: llama-swap
mcpjungle:                      # the MCP gateway (lab mcp setup / hub/mcp/setup.sh)
  version: 0.4.7                # the CLI; same version as the mcpjungle image in hub/compose.yaml (Renovate moves both)
  bin: ~/.local/bin/mcpjungle
  registry: http://127.0.0.1:8085
enso:
  container: enso
  image: enso-agent:537559a     # same tag as agents/enso/compose.yaml and enso.sh (Enso commit 537559a)
