# llama-swap on marvin (Bosgame M5, Strix Halo, 128 GB shared memory).
# Build: docker build -t llama-swap-marvin:267 ~/llama-swap   (same Dockerfile as zaphod's text-only image)
# Start: docker compose up -d     Logs: docker compose logs -f
services:
  llama-swap:
    build: .                            # docker compose build
    image: llama-swap-marvin:267
    container_name: llama-swap
    restart: unless-stopped
    # Only marvin itself can reach 8080; `tailscale serve` exposes it to the tailnet.
    ports:
      - "127.0.0.1:8080:8080"
    devices:
      - /dev/dri
    volumes:
      - /srv/models:/models:ro
      - ./config:/etc/llama-swap/config
      - ./data:/data
    env_file: .env
    # No GGML_VK_DISABLE_HOST_VISIBLE_VIDMEM here: marvin's GPU shares system memory,
    # so the zaphod fix doesn't apply.

  # GPU load, memory, temperature and power for the Homepage start page (read-only, from /sys).
  gpu-stats:
    image: python:3.13-slim-trixie
    container_name: gpu-stats
    restart: unless-stopped
    network_mode: host
    read_only: true
    user: "65534:65534"
    volumes:
      - ${HOME}/homelab/hub/gpu-stats/gpu_stats.py:/app/gpu_stats.py:ro   # full path: ~/llama-swap is a link
    environment:
      LISTEN: ${TAILSCALE_IP:?set TAILSCALE_IP in .env}:9101   # Tailscale only; zaphod's Homepage reads it
      MEMORY: gtt                        # shared memory: GTT is what the GPU can use
      CARD_NAMES: "0000:c5:00.0=Radeon 8060S"
    command: ["python3", "/app/gpu_stats.py"]

  # Monitoring agent. Start with:  docker compose --profile agent up -d
  # BESZEL_KEY in .env = the hub's public key (same value as hub/.env on zaphod).
  beszel-agent:
    image: henrygd/beszel-agent:0.21.1-alpine
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    profiles: [agent]
    security_opt:
      - apparmor:unconfined   # Docker's AppArmor profile blocks the D-Bus calls for systemd status
    devices:
      - /dev/nvme0n1:/dev/nvme0
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    environment:
      LISTEN: ${TAILSCALE_IP:?set TAILSCALE_IP in .env}:45876   # Tailscale only; zaphod's Beszel hub connects here
      KEY: ${BESZEL_KEY:-}
      GPU_COLLECTOR: amd_sysfs
      SERVICE_PATTERNS: "docker*,containerd*,tailscaled*,ssh*"
    volumes:
      - ./data/beszel-agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
