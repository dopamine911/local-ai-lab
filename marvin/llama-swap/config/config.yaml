# llama-swap config for marvin. Big models, one at a time.
healthCheckTimeout: 900            # big models take a while to load
logToStdout: "proxy,upstream"
sendLoadingState: true
store:
  path: /data/activity.sqlite

apiKeys:
  - "${env.MARVIN_KEY}"

macros:
  # -lm dio: direct I/O loading; loads a 93 GB model in about 33 s on Strix Halo.
  # --cache-ram 0 --no-cache-idle-slots (both: either alone still leaks): llama.cpp#27148 can put text from another
  # conversation into a new one through the RAM prompt cache (reproduced upstream with -kvu and one user, like here).
  # Cost: a conversation that lost its slot is read again in full (issue #10, plans/cache-leak-timeline.md).
  server: llama-server --port ${PORT} -ngl 999 -fa on -lm dio --cache-ram 0 --no-cache-idle-slots
  qwen-sampling: --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --reasoning-effort medium
  # Speculative decoding (MTP draft head), 3 tokens: 39.6 tok/s writing vs 24.7 without; 2 = 37.6, 4 = 36.5 (SETUP.md step 14).
  mtp: --model-draft /models/mtp-Qwen3.8-Flash-Next-Q8_0.gguf --spec-type draft-mtp --spec-draft-n-max 3

models:
  big:
    name: "Qwen3.8-Flash-Next (marvin)"
    description: "Strongest model. Two agents share 256K of context (clients cap each conversation at 128K)."
    cmd: |
      ${server}
      -m /models/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
      -c 262144 -np 2 -kvu
      ${qwen-sampling}
      ${mtp}

hooks:
  on_startup:
    preload: [big]
