# llama-swap config for marvin. Big models, one at a time.
healthCheckTimeout: 900            # big models take a while to load
logToStdout: "proxy,upstream"
sendLoadingState: true
store:
  path: /data/activity.sqlite

apiKeys:
  - "${env.MARVIN_KEY}"

macros:
  # -lm dio: direct I/O loading; loads a 93 GB model in about 33 s on Strix Halo.
  # --cache-ram 0 --no-cache-idle-slots (both: either alone still leaks): llama.cpp#27148 can put text from another
  # conversation into a new one through the RAM prompt cache (reproduced upstream with -kvu and one user, like here).
  # Cost: a conversation that lost its slot is read again in full (issue #10, plans/cache-leak-timeline.md).
  server: llama-server --port ${PORT} -ngl 999 -fa on -lm dio --cache-ram 0 --no-cache-idle-slots
  qwen-sampling: --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --reasoning-effort medium
  # Speculative decoding (MTP draft head), 3 tokens: 39.6 tok/s writing vs 24.7 without; 2 = 37.6, 4 = 36.5 (SETUP.md step 14).
  mtp: --model-draft /models/mtp-Qwen3.8-Flash-Next-Q8_0.gguf --spec-type draft-mtp --spec-draft-n-max 3

models:
  big:
    name: "Qwen3.8-Flash-Next (marvin)"
    description: "Strongest model. Two agents share 256K of context (clients cap each conversation at 128K)."
    cmd: |
      ${server}
      -m /models/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
      -c 262144 -np 2 -kvu
      -ub 2048
      ${qwen-sampling}
      ${mtp}

  gpt-oss:
    name: "gpt-oss-120b (marvin, test)"
    description: "OpenAI gpt-oss-120b MXFP4, 128K, one slot. Test entry (plans/gpt-oss-timeline.md); swaps with big."
    # -np 1: the server's default slot count would split 128K into smaller pieces (the 32K speed test needs one big slot).
    # -b/-ub 4096 (2026-11-09): 32K reading 557.6 (default 512) → 764.8 (2048) → 820.5 tok/s (4096), writing same, +~3 GB.
    # EAGLE3 draft tried: writing -26%, reading -10% (MLflow ef305ba2), off.
    # Sampling: OpenAI's recommended temp 1.0, top-p 1.0; reasoning effort medium (the model's default).
    cmd: |
      ${server}
      -m /models/gpt-oss-120b-MXFP4.gguf
      -c 131072 -np 1 -b 4096 -ub 4096
      --temp 1.0 --top-p 1.0 --reasoning-effort medium

  chat-teacher:
    name: "Gemma 4 31B trace teacher (marvin)"
    description: "zaphod's chat-teacher on marvin (pocket-tank issue #1): same file and settings; swaps with big."
    # Same flags as zaphod's chat-teacher (4 slots of 4K, --swa-full, q8_0, thinking off, Google's sampling defaults);
    # the macro adds -lm dio (load mode only). Tested 2026-11-09 against zaphod's: speed and answers in plans/teacher-timeline.md.
    cmd: |
      ${server}
      -m /models/gemma/gemma-4-31B_q4_0-it.gguf
      -c 16384 -np 4 --swa-full -ctk q8_0 -ctv q8_0 --reasoning off
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0
    ttl: 900   # back to big's slot after 15 idle minutes (big loads on its next request)

  # Engines started by the launcher (engines/lab-engined.py; allowlist engines/marvin.json). llama-swap runs the client;
  # the engine is a container on the internal lab-engines network, reached by its name.
  test-http:
    name: "Launcher test (no GPU)"
    description: "Test entry for the engine launcher (plans/engine-launcher-timeline.md); answers ok, no model. Swaps with big."
    proxy: http://lab-engine-test-http:8080
    cmd: /engines/lab-engine run test-http
    cmdStop: /engines/lab-engine stop test-http
    checkEndpoint: /
    unloadTimeout: 90

  big-halogen:
    name: "Qwen3.8-Flash-Next on Halogen Flash (marvin, test)"
    description: "big's model on the Halogen Flash engine (launcher engine; plans/halogen-timeline.md). Test only. Swaps with big."
    proxy: http://lab-engine-big-halogen:8731
    cmd: /engines/lab-engine run big-halogen
    cmdStop: /engines/lab-engine stop big-halogen
    checkEndpoint: /health
    unloadTimeout: 300   # its stop timeout is 120 s (engines/marvin.json)

profiles:
  training:
    # lab training-mode on|off|status (run on zaphod). A training harness checks GET /api/profiles for active == "training".
    description: "8060S lent to model training (lab training-mode on)"
    pins:
      big: ~
      gpt-oss: ~
      chat-teacher: ~
      test-http: ~
      big-halogen: ~
hooks:
  on_startup:
    preload: [big]
