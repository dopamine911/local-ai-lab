healthCheckTimeout: 300
logToStdout: "proxy,upstream"
sendLoadingState: true
store:
  path: /data/activity.sqlite
apiKeys:
  - "${env.ZAPHOD_KEY}"
macros:
  server: llama-server --port ${PORT} -ngl 999 -fa on
  qwen27: /models/Qwen3.8-27B-UD-Q4_K_XL.gguf
  qwen-sampling: --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --reasoning-effort medium
  mtp: --model-draft /models/mtp-Qwen3.8-27B-Q4_0.gguf --spec-type draft-mtp --spec-draft-n-max 2
# Device numbers: llama.cpp calls card 1 (PCI 06:00.0, OCuLink) Vulkan1 and card 2 (PCI 0b:00.0, x16 slot) Vulkan0.
# Check: llama-server --list-devices; the card with less free memory is the busier one.
models:
  coder:
    name: "Qwen3.8-27B, card 1"
    cmd: ${server} --device Vulkan1 -m ${qwen27} -c 65536 -np 1 ${qwen-sampling} ${mtp}
  coder-2:
    name: "Qwen3.8-27B, card 2"
    cmd: ${server} --device Vulkan0 -m ${qwen27} -c 65536 -np 1 ${qwen-sampling} ${mtp}
  coder-tb:
    name: "Qwen3.8-27B, card 1, 256K context (benchmarks)"
    cmd: ${server} --device Vulkan1 -m ${qwen27} -c 262144 -np 1 -ctk q8_0 -ctv q8_0 ${qwen-sampling} ${mtp}
  flint:
    name: "Flint 40B-A2.5B (Recursive), card 2, 256K context"
    cmd: ${server} --device Vulkan0 -m /models/flint-UD-Q4_K_XL.gguf -c 262144 -np 1 -ctk q8_0 -ctv q8_0 --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
  north:
    name: "North-Mini-Code-1.0 30B-A3B (Cohere), card 2, 256K context"
    cmd: ${server} --device Vulkan0 -m /models/North-Mini-Code-1.0-UD-Q4_K_XL.gguf -c 262144 -np 1 -ctk q8_0 -ctv q8_0 --temp 1.0 --top-p 0.95
  ornith:
    name: "Ornith-1.5 35B-A3B, card 2, 256K context, vision"
    cmd: ${server} --device Vulkan0 -m /models/ornith/Ornith-1.5-35B-Q4_K_M.gguf --mmproj /models/ornith/mmproj-Ornith-1.5-35B-BF16.gguf -c 262144 -np 1 -ctk q8_0 -ctv q8_0 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0
  chat:
    name: "Gemma 4 31B (Google QAT Q4_0), general chat + vision, card 2, 128K context"
    cmd: ${server} --device Vulkan0 -m /models/gemma/gemma-4-31B_q4_0-it.gguf --mmproj /models/gemma/gemma-4-31B-it-mmproj.gguf -c 131072 -np 1 -ctk q8_0 -ctv q8_0 --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0
  embed:
    name: "Qwen3-Embedding-4B (document search), card 1"
    cmd: ${server} --device Vulkan1 -m /models/search/Qwen3-Embedding-4B-Q6_K.gguf --embedding --pooling last -c 8192 -b 8192 -ub 8192 -np 1
  rerank:
    name: "Qwen3-Reranker-0.6B (document search), card 1"
    cmd: ${server} --device Vulkan1 -m /models/search/qwen3-reranker-0.6b-q8_0.gguf --reranking -c 8192 -b 8192 -ub 8192 -np 1
  stt:
    name: "Qwen3-ASR-1.7B speech-to-text (default), card 2"
    cmd: audiocpp_server --config /etc/llama-swap/config/stt.json --port ${PORT} --no-ui
    checkEndpoint: /health
  stt-whisper:
    name: "Whisper large-v3-turbo speech-to-text (99 languages), card 2"
    cmd: whisper-server --host 127.0.0.1 --port ${PORT} --device 0 -m /models/speech/ggml-large-v3-turbo-q8_0.bin -l auto --inference-path /v1/audio/transcriptions
    checkEndpoint: /
  tts:
    name: "Kokoro-82M text-to-speech (default, 54 voices), card 2"
    cmd: audiocpp_server --config /etc/llama-swap/config/tts.json --port ${PORT} --no-ui
    checkEndpoint: /health
  tts-qwen:
    name: "Qwen3-TTS-1.7B text-to-speech (10 languages, style instructions), card 2; runs with coder-2, not ornith"
    cmd: audiocpp_server --config /etc/llama-swap/config/tts-qwen.json --port ${PORT} --no-ui
    checkEndpoint: /health
  coder-long:
    name: "Qwen3.8-27B, both cards, long context"
    cmd: ${server} --device Vulkan1,Vulkan0 -m ${qwen27} -c 262144 -np 2 -kvu ${qwen-sampling}
profiles:
  image-mode:
    description: "Card 2 lent to ComfyUI (hub/image-mode on): coder-2 answered by coder; other card-2 chat models off"
    pins:
      coder-2: coder
      ornith: ~
      chat: ~
      north: ~
      flint: ~
      tts-qwen: ~
routing:
  router:
    use: matrix
    settings:
      matrix:
        sets:
          helpers: "embed & rerank & stt & stt-whisper & tts"   # small models that stay loaded next to everything below
          one_per_card: "+helpers & (coder | coder-tb) & (coder-2 | flint | north | ornith | chat)"
          voice: "+helpers & (coder | coder-tb) & coder-2 & tts-qwen"   # Qwen-TTS only fits next to coder-2
          both_cards: "coder-long"
hooks:
  on_startup:
    preload: [coder, coder-2, embed, rerank, stt, stt-whisper, tts]
