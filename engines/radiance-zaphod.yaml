# Radiance 2.1.0 on zaphod's two R9700s (plans/radiance-timeline.md), started by the launcher as `coder-radiance`
# (engines/zaphod.json). Mounted read-only as /etc/radiance/config.yaml. The model's settings are Radiance's own row for
# Qwen3.8-27B IQ8R (README, tp2.radiance.yaml at v2.1.0); sampling and effort are coder's, so the comparison is fair.
# No API key: the container is only on the internal lab-engines network, and llama-swap checks the key in front.
server:
  host: "0.0.0.0"
  port: 8000
cards: all
scheduler:
  load-timeout: 600s
models:
  # The entry's name is the model id a request gives: the same as llama-swap's entry, which forwards it unchanged.
  coder-radiance:
    model: /models/qwen3.8-27b-iq8r-dflash.rad
    tp: 2
    max-num-seqs: 32
    max-model-len: 200000
    kv-cache-dtype: i8
    temp: 1.0
    top-p: 0.95
    top-k: 20
    min-p: 0.0
    reasoning-effort: medium
