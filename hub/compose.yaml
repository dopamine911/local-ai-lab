# Hub services on zaphod. llama-swap itself lives in ~/llama-swap (separate, already running).
# Start:  cd ~/homelab/hub && docker compose up -d --build     Logs: docker compose logs -f
#
# Every service uses the host network but listens only on 127.0.0.1, so nothing is
# reachable from your home network. Caddy is the only door in, and it listens only on
# zaphod's Tailscale address (TS_IP in .env).
services:
  caddy:
    build: ./caddy                      # Caddy 2.11.7 + Cloudflare DNS module
    image: caddy-cloudflare:2.11.7
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    env_file: .env                      # DOMAIN, TS_IP, CF_API_TOKEN, ZAPHOD_KEY, MARVIN_KEY
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./models-panel:/srv/models-panel:ro
      - ./data/caddy:/data              # certificates; keep this folder
      - ./data/caddy-config:/config

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded
    container_name: open-webui
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: 3000
      WEBUI_URL: https://chat.${DOMAIN}
      OPENAI_API_BASE_URL: http://127.0.0.1:8080/v1   # zaphod's llama-swap (also lists marvin's models)
      OPENAI_API_KEY: ${ZAPHOD_KEY}
      ENABLE_OLLAMA_API: "false"
      # Fixed key: otherwise a new one is made on every container recreate (logs you out,
      # breaks saved tool logins). Copied from the key Open WebUI generated on first start.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      # ---- All Open WebUI settings live HERE, not in the web page. ----
      # These fill an EMPTY Open WebUI (a rebuild). On the running one, the database wins, so after changing a value
      # here run hub/openwebui/sync.sh; hub/openwebui/drift.sh shows anything changed in the web page instead.
      # Names checked against Open WebUI v0.12.4 (backend/open_webui/config.py); re-check after upgrading.
      # Accounts
      ENABLE_SIGNUP: "false"                       # only the admin account; nobody can sign up
      ENABLE_API_KEYS: "true"                      # for scripts (OPENWEBUI_API_KEY in .env)
      # Web search through the private SearXNG below
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://127.0.0.1:8888/search?q=<query>
      WEB_SEARCH_RESULT_COUNT: "3"
      ENABLE_WEB_SEARCH_CONFIRMATION: "true"
      # Page loading after a search: plain HTTP from zaphod. Never local/home/Tailscale addresses (the default; set
      # explicitly so an upgrade can't change it). Tested 2026-10-29: example.com loads; router, 127.0.0.1, marvin refused.
      ENABLE_LOCAL_WEB_FETCH: "false"
      # Documents: embeddings and re-ranking from llama-swap (models embed + rerank, card 1)
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: embed
      RAG_OPENAI_API_BASE_URL: http://127.0.0.1:8080/v1
      RAG_OPENAI_API_KEY: ${ZAPHOD_KEY}
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_RERANKING_ENGINE: external
      RAG_EXTERNAL_RERANKER_URL: http://127.0.0.1:8080/v1/rerank
      RAG_EXTERNAL_RERANKER_API_KEY: ${ZAPHOD_KEY}
      RAG_RERANKING_MODEL: rerank
      # Speech from llama-swap: stt (Qwen3-ASR), tts (Kokoro, voice af_heart)
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_MODEL: stt
      AUDIO_STT_OPENAI_API_BASE_URL: http://127.0.0.1:8080/v1
      AUDIO_STT_OPENAI_API_KEY: ${ZAPHOD_KEY}
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_MODEL: tts
      AUDIO_TTS_VOICE: af_heart
      AUDIO_TTS_OPENAI_API_BASE_URL: http://127.0.0.1:8080/v1
      AUDIO_TTS_OPENAI_API_KEY: ${ZAPHOD_KEY}
      # Tools: the MCP gateway (hub/mcp) and Context7 (public docs lookup, no login). The long ids are the ones Open
      # WebUI gave the connections when they were added by hand; kept so nothing that refers to them breaks.
      TOOL_SERVER_CONNECTIONS: >-
        [{"type": "mcp", "url": "http://127.0.0.1:8085/mcp", "spec_type": "url", "spec": "", "path": "openapi.json",
          "auth_type": "bearer", "key": "${MCP_TOKEN_OPENWEBUI}",
          "config": {"enable": true, "function_name_filter_list": "", "access_grants": []},
          "info": {"id": "homelab-tools", "name": "Homelab tools (MCPJungle)", "description": "Agent tools from zaphod's MCP gateway"}},
         {"type": "mcp", "url": "https://mcp.context7.com/mcp", "spec_type": "url", "spec": "", "path": "openapi.json",
          "auth_type": "none", "forward_cookies": false, "headers": null, "key": "",
          "config": {"enable": true, "function_name_filter_list": "", "access_grants": []},
          "info": {"id": "f9062e23-d37d-4e7a-95d9-60753c999f1c", "name": "Context7", "description": "Up-to-date library documentation"}}]
      # Models: native function calling for every model (tools work properly). Per-model settings (vision, hidden
      # helpers): openwebui/models.yaml, applied with openwebui/models.sh --apply
      DEFAULT_MODEL_PARAMS: '{"function_calling": "native"}'
      # Images: ComfyUI on card 2. Works ONLY while image mode is on (~/homelab/hub/image-mode on); otherwise image
      # requests fail. Workflow and node map: openwebui/comfyui.env (Z-Image Turbo; `make-comfyui-env.sh qwen` for Qwen-Image)
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: comfyui
      COMFYUI_BASE_URL: http://127.0.0.1:8188
      IMAGE_SIZE: 1024x1024
      IMAGE_STEPS: "8"
      # Code runner: Open Terminal (service below)
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id": "c1426adc-e62a-4344-a937-7aa94537de8c", "name": "Open Terminal", "enabled": true, "url": "http://127.0.0.1:8000",
          "path": "/openapi.json", "key": "${OPEN_TERMINAL_API_KEY}", "auth_type": "bearer", "forward_cookies": false,
          "config": {"access_grants": [], "working_directory_context": true, "user_shell_tools": "auto"},
          "server_type": null, "policy_id": null}]
    env_file:
      - ./openwebui/comfyui.env          # image workflow + node map, generated by openwebui/make-comfyui-env.sh
    volumes:
      - ./data/open-webui:/app/backend/data

  beszel:
    image: henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    container_name: beszel
    restart: unless-stopped
    network_mode: host
    command: ["serve", "--http=127.0.0.1:8090"]
    volumes:
      - ./data/beszel:/beszel_data

  # Monitoring agent for zaphod. Starts only with:  docker compose --profile agent up -d
  # Fill BESZEL_KEY in .env first (README step 7).
  beszel-agent:
    image: henrygd/beszel-agent:0.21.1-alpine@sha256:4100e26f7b5e6ab89e73699b2366417795f5046ab36bc452daf1f105766b40a0
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    profiles: [agent]
    security_opt:
      - apparmor:unconfined   # Docker's AppArmor profile blocks the D-Bus calls for systemd status
    devices:
      - /dev/nvme0n1:/dev/nvme0
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    environment:
      LISTEN: 127.0.0.1:45876
      KEY: ${BESZEL_KEY:-}
      GPU_COLLECTOR: amd_sysfs        # reads the R9700s straight from /sys
      SERVICE_PATTERNS: "docker*,containerd*,tailscaled*,ssh*"  # systemd services to show
    volumes:
      - ./data/beszel-agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro  # systemd service status

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2@sha256:2cc40b3208991940d824d04f339833a0b69507569012aa5ec545690608602fc0
    container_name: mlflow
    restart: unless-stopped
    network_mode: host
    command: >
      mlflow server --host 127.0.0.1 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow.${DOMAIN},127.0.0.1:5000,localhost:5000
      --cors-allowed-origins https://mlflow.${DOMAIN}
    volumes:
      - ./data/mlflow:/mlflow            # every test result; keep this folder

  # Private web search for Open WebUI. Its own network; only zaphod can reach it.
  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba@sha256:f4aa660c54d062dedb268be84e821ea24e39f48c7a496af8dd02cc9eedb93847
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./data/searxng-cache:/var/cache/searxng

  # MCP gateway: one place for agent tools (plans/agent-infra.md step 3). Enterprise mode = every agent needs its
  # own token and only reaches the tool servers it is allowed. Admin with the mcpjungle CLI on zaphod.
  # Free and open source (MPL-2.0); "enterprise" is only the locked-down mode. Tools run in their OWN containers below,
  # never inside this one (its database holds every agent's token).
  mcpjungle:
    image: ghcr.io/mcpjungle/mcpjungle:0.4.7@sha256:ac387071719c5703614524791c5052b12df16b2d114e277ab1862402c5105b0c
    container_name: mcpjungle
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    command: ["start", "--enterprise", "--sqlite-db-path", "/data/mcpjungle.db"]
    ports:
      - "127.0.0.1:8085:8080"            # zaphod only; marvin will reach it through Caddy over Tailscale
    environment:
      OTEL_ENABLED: "false"
    volumes:
      - ./data/mcpjungle:/data           # SQLite database (nightly backup copies it)
    networks: [default, browser-internal, agents-internal, memory-internal]   # browser-internal: playwright-mcp; agents-internal: containerised agents (agents/enso); memory-internal: mcp-localrecall

  # Tool: web search through our SearXNG. Reached only by mcpjungle over the compose network; no published port.
  mcp-searxng:
    image: isokoliuk/mcp-searxng:2.9.0@sha256:8f1dd92a9e2875cb4e8df7036785ec4c088b7600cefb611de472a352a3dcba60
    container_name: mcp-searxng
    restart: unless-stopped
    read_only: true
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_HOST: 0.0.0.0             # inside its container; nothing is published to the host
      MCP_HTTP_HARDEN: "true"            # other hub containers share this network: require a token
      MCP_HTTP_AUTH_TOKEN: ${MCP_SEARXNG_TOKEN:?set MCP_SEARXNG_TOKEN in .env}
      MCP_HTTP_ALLOWED_HOSTS: mcp-searxng,mcp-searxng:3000   # MCPJungle sends the port in the Host header
      MCP_HTTP_ALLOWED_ORIGINS: http://mcp-searxng:3000   # no browser calls it; only mcpjungle (no Origin header)

  # Tool: a web browser for agents (Playwright MCP, headless Chromium). Lives ONLY on the internal browser network:
  # no route out except browser-proxy, which refuses home-network/Tailscale/internal addresses. No published port,
  # no files from the host, profile in memory (--isolated), read-only filesystem. Reached only through mcpjungle.
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:v0.0.83@sha256:690763cbb437ee7233f538a953bb5390bf03791eb5c965b471e59d17a6132fcb
    container_name: playwright-mcp
    restart: unless-stopped
    init: false                        # the image already runs tini
    read_only: true
    tmpfs: [/tmp, "/home/node:mode=1777"]   # in memory; the browser user (node) must be able to write its home
    shm_size: 1gb                      # Chromium needs shared memory
    networks: [browser-internal]
    command: >-
      --isolated --host 0.0.0.0 --port 8931
      --allowed-hosts playwright-mcp:8931,playwright-mcp
      --proxy-server http://browser-proxy:3128
      --blocked-origins http://localhost:*;http://127.0.0.1:*
      --output-dir /tmp/playwright-output

  # The browser's only way out (hub/browser-proxy/squid.conf): web ports only, private destinations refused.
  browser-proxy:
    image: ubuntu/squid:7.2-26.04_edge@sha256:d11db6479501aa4618b3253f95a88b2547229e2d081726b6fb20dc75a98cc61b
    container_name: browser-proxy
    restart: unless-stopped
    networks: [default, browser-internal]
    volumes:
      - ./browser-proxy/squid.conf:/etc/squid/squid.conf:ro

  # A sandboxed Linux shell + files for the models (connected in Open WebUI as a terminal).
  # The AI works inside this container only: own home folder, no Docker socket, no host files.
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.14.7@sha256:f231354ca43b5ab68e383548f1ed24fc7ce0ac5f6b542ddff0b2421e2b0154ce
    container_name: open-terminal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY}
    volumes:
      - ./data/open-terminal:/home/user

  # ComfyUI on card 2. Not started with the rest: `./image-mode on` frees card 2 and starts it,
  # `./image-mode off` stops it and gives card 2 back to llama-swap.
  comfyui:
    build: ./comfyui                    # docker compose --profile images build comfyui
    image: comfyui-zaphod:v0.43.0-torch2.15.0-rocm7.14
    container_name: comfyui
    profiles: [images]
    restart: "no"
    network_mode: host                  # listens on 127.0.0.1:8188 only; Caddy serves comfy.<DOMAIN>
    devices:
      - /dev/kfd
      - /dev/dri/renderD129             # card 2 only (PCI 0b:00.0)
    group_add: ["991", "44"]            # render, video
    volumes:
      - /srv/models/comfyui:/home/comfy/ComfyUI/models
      - ./data/comfyui/input:/home/comfy/ComfyUI/input
      - ./data/comfyui/output:/home/comfy/ComfyUI/output
      - ./data/comfyui/user:/home/comfy/ComfyUI/user
      - ./data/comfyui/custom_nodes:/home/comfy/ComfyUI/custom_nodes

  # GPU load, memory, temperature and power for the Homepage start page (read-only, from /sys).
  gpu-stats:
    image: python:3.13.18-slim-trixie@sha256:76baad6037690d6e8c4397fbcaef17bca6f19eecef822b708fe8fa3417d30bb5
    container_name: gpu-stats
    restart: unless-stopped
    network_mode: host
    read_only: true
    user: "65534:65534"
    volumes:
      - ./gpu-stats/gpu_stats.py:/app/gpu_stats.py:ro
    environment:
      LISTEN: 127.0.0.1:9101
      MEMORY: vram
      CARD_NAMES: "0000:06:00.0=card 1 (OCuLink),0000:0b:00.0=card 2 (x16)"
    command: ["python3", "/app/gpu_stats.py"]

  # Agent statistics for the Homepage start page (read-only): requests, tokens, speeds (24 h), slots, context use.
  agent-stats:
    image: python:3.13.18-slim-trixie@sha256:76baad6037690d6e8c4397fbcaef17bca6f19eecef822b708fe8fa3417d30bb5
    container_name: agent-stats
    restart: unless-stopped
    network_mode: host
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    volumes:
      - ./agent-stats/agent_stats.py:/app/agent_stats.py:ro
      - ../zaphod/llama-swap/data:/data          # llama-swap's activity.sqlite, opened read-only (writable dir: SQLite's -shm file)
    environment:
      LISTEN: 127.0.0.1:9102
      API_KEY: ${ZAPHOD_KEY}
    command: ["python3", "/app/agent_stats.py"]

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    restart: unless-stopped
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: 3001
      HOMEPAGE_ALLOWED_HOSTS: ${DOMAIN},homepage.${DOMAIN}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
      HOMEPAGE_VAR_ZAPHOD_KEY: ${ZAPHOD_KEY}            # loaded-models widgets
      HOMEPAGE_VAR_MARVIN_KEY: ${MARVIN_KEY}
      HOMEPAGE_VAR_UNRAID_URL: ${UNRAID_URL:-}          # NAS tile (after the NAS rebuild)
      HOMEPAGE_VAR_UNRAID_KEY: ${UNRAID_KEY:-}
      HOMEPAGE_VAR_BESZEL_USER: ${BESZEL_USER:-}        # Beszel widget: your Beszel login (email)
      HOMEPAGE_VAR_BESZEL_PASSWORD: ${BESZEL_PASSWORD:-}
    volumes:
      - ./homepage:/app/config
      - ../assets:/app/public/images:ro   # background picture etc. (repo folder assets/)

  # Memory, part 1: LocalRecall (plans/agent-infra.md step 4). Searches the lab's Markdown docs (~/homelab and
  # ~/full-homelab), embedded with llama-swap's `embed`. Agents reach it only through mcpjungle (tool `memory`).
  # The private repo's text is inside: no published port, no internet (internal networks only).
  localrecall-db:
    image: quay.io/mudler/localrecall:v0.6.6-postgresql@sha256:3ec207438a350b30186462904527a3489a9b1e6a9e419a1d67da099c814723cd
    container_name: localrecall-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: localrecall
      POSTGRES_USER: localrecall
      POSTGRES_PASSWORD: ${LOCALRECALL_DB_PASSWORD:?set LOCALRECALL_DB_PASSWORD in .env}
    volumes:
      - ./data/localrecall-db:/var/lib/postgresql/data   # nightly backup copies hub/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localrecall"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [memory-internal]

  localrecall:
    image: quay.io/mudler/localrecall:v0.6.6@sha256:87bbe080dc142492e3a24c2761b2e6ae3d162ab661a6d43004cd7a55da147e05
    container_name: localrecall
    restart: unless-stopped
    environment:
      VECTOR_ENGINE: postgres
      DATABASE_URL: postgresql://localrecall:${LOCALRECALL_DB_PASSWORD}@localrecall-db:5432/localrecall?sslmode=disable
      EMBEDDING_MODEL: embed                       # llama-swap: Qwen3-Embedding-4B (card 1, always loaded)
      OPENAI_BASE_URL: http://llama-swap:8080/v1
      OPENAI_API_KEY: ${ZAPHOD_KEY}
      API_KEYS: ${LOCALRECALL_API_KEY:?set LOCALRECALL_API_KEY in .env}
      FILE_ASSETS: /assets
      HYBRID_SEARCH_BM25_WEIGHT: "0.5"             # keyword + vector (good for names like GGML_VK_...)
      HYBRID_SEARCH_VECTOR_WEIGHT: "0.5"
    volumes:
      - ./data/localrecall:/assets
    depends_on:
      localrecall-db: {condition: service_healthy}
    networks: [memory-internal, agents-internal]   # agents-internal: to reach llama-swap (embed); API key required

  mcp-localrecall:
    build: {context: memory, dockerfile: mcp-localrecall.Dockerfile}
    image: mcp-localrecall:0.0.4-proxy0.13.0
    container_name: mcp-localrecall
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      LOCALRECALL_URL: http://localrecall:8080
      LOCALRECALL_API_KEY: ${LOCALRECALL_API_KEY}
      LOCALRECALL_COLLECTION: homelab                # tools need no collection argument
      LOCALRECALL_ENABLED_TOOLS: search,list_files   # read-only: only memory-sync writes
    networks: [memory-internal]                      # only mcpjungle reaches it

  # Memory, part 2: Mnemosyne 4.0.0 (plans/agent-infra.md step 4b). Short memories agents save and recall
  # (preferences, decisions, facts), one SQLite file. Saving calls no model; embeddings by its own small local model
  # (in the image). MCP over streamable HTTP with a bearer token. Only mcpjungle reaches it (memory-internal, no
  # internet); there all but five of its tools are switched off (hub/mcp/setup.sh). Agent tool name: `recall`.
  mnemosyne:
    build: {context: memory, dockerfile: mnemosyne.Dockerfile}
    image: mnemosyne:4.0.0
    container_name: mnemosyne
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      MNEMOSYNE_MCP_TOKEN: ${MNEMOSYNE_MCP_TOKEN:?set MNEMOSYNE_MCP_TOKEN in .env}
      MNEMOSYNE_MCP_ALLOWED_HOSTS: mnemosyne,mnemosyne:*   # the Host header mcpjungle sends
      MNEMOSYNE_AUTHOR_ID: mcp
      # Let meaning alone find a memory (default: a memory must first share enough words with the question).
      # Project's own measurement: 6/8 -> 7/8 natural-language probes; wider results only matter with several users
      # in one bank (here: one). Measured here 2026-10-30, see plans/agent-infra.md step 4b.
      MNEMOSYNE_POLYPHONIC_RECALL: "1"
    volumes:
      - ./data/mnemosyne:/data                      # the memories (nightly backup copies hub/data)
    networks: [memory-internal]

  # Uploads changed Markdown files: `docker compose --profile sync run --rm memory-sync` (cron: setup/memory-sync.cron)
  memory-sync:
    profiles: [sync]
    image: docker.io/library/python:3.12.16-slim@sha256:8523d6abeb48ceae0b7240d30c5808fc26cb79c1a635bacdf19cf3baecfbec07
    user: "1000:1000"
    read_only: true
    command: ["python3", "-I", "/app/sync.py"]
    environment:
      LOCALRECALL_API_KEY: ${LOCALRECALL_API_KEY}
    volumes:
      - ./memory/sync.py:/app/sync.py:ro
      - ./data/memory-sync:/state
      - ..:/src/homelab:ro
      - ${HOME}/full-homelab:/src/full-homelab:ro
    networks: [memory-internal]

networks:
  # Created by zaphod/llama-swap (starts first): containerised agents reach mcpjungle here, with no other route out.
  agents-internal:
    external: true
  # Memory (LocalRecall, its database, its MCP bridge, the sync): no route out. mcpjungle joins it to reach the bridge.
  memory-internal:
    internal: true
  # Internal: no route to the internet or the host's networks. Fixed subnet so the proxy can allow only this network.
  browser-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
