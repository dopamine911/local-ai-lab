# Egress filter for the agents' browser (playwright-mcp). The browser has NO other way out: it sits on an internal
# Docker network, and this proxy is its only door. Playwright MCP is "not a security boundary" (Microsoft), and pages
# can redirect it anywhere, so the check happens here, on the real destination address Squid itself resolves.
http_port 3128

# Only the browser's internal network may use this proxy (subnet fixed in compose.yaml)
acl browser_net src 172.31.250.0/24

# Destinations the browser must never reach: this machine, the home network, Tailscale, Docker networks,
# link-local/cloud metadata, multicast and reserved ranges (IPv4 and IPv6)
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24
acl private_dst dst 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
# (fc00::/7 also covers Tailscale IPv6, fd7a:115c:a1e0::/48)
acl private_dst dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8

acl web_ports port 80 443
acl CONNECT method CONNECT

http_access deny !browser_net
http_access deny private_dst
http_access deny !web_ports
http_access deny CONNECT !web_ports
http_access allow browser_net
http_access deny all

# No cache, no identifying headers
cache deny all
via off
forwarded_for delete
# Logs: docker exec browser-proxy tail /var/log/squid/access.log (TCP_DENIED = blocked)
pid_filename none
