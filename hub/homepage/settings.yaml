title: Homelab
theme: dark
color: slate
# Background: NASA SVS wallpaper "CW Leo from GALEX" (svs.gsfc.nasa.gov/14866, public domain), stored in assets/.
background:
  image: /images/CW_Leo_From_GALEX_desktop.jpg
  blur: sm           # sm, md, xl
  brightness: 75     # darker, so tile text stays readable
cardBlur: md         # frosted tiles over the image
headerStyle: clean
statusStyle: dot
hideVersion: true
layout:
  zaphod:
    style: row
    columns: 4
  marvin:
    style: row
    columns: 4
  NAS:
    style: row
    columns: 4
  Apps:
    style: row
    columns: 4
  Background services:
    style: row
    columns: 4
