title: Homelab
theme: dark
color: slate
# Background: NASA SVS wallpaper "NGC 1929 from Spitzer, Chandra, ESO" (svs.gsfc.nasa.gov/14866, public domain), in assets/.
# Other pictures in assets/ can go here too (e.g. CW_Leo_From_GALEX_desktop.jpg). After adding a NEW file to
# assets/, restart Homepage once (cd ~/homelab/hub && docker compose restart homepage); it only sees files present at start.
background:
  image: /images/NGC_1929_from_Spitzer_Chandra_ESO_desktop.png
  blur: sm           # sm, md, xl
  brightness: 75     # darker, so tile text stays readable
cardBlur: md         # frosted tiles over the image
headerStyle: clean
statusStyle: dot
hideVersion: true
layout:
  zaphod:
    style: row
    columns: 4
  marvin:
    style: row
    columns: 4
  NAS:
    style: row
    columns: 4
  Apps:
    style: row
    columns: 4
  Background services:
    style: row
    columns: 4
