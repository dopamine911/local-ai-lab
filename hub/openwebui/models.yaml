# How each llama-swap model appears in Open WebUI (applied by hub/openwebui/models.sh).
# Names and the model list come from the llama-swap configs (zaphod + marvin as "marvin/<id>"); not repeated here.
# Defaults for every chat model: native function calling (tools work properly), all abilities on except vision.
vision:            # load a vision file (--mmproj) in llama-swap: can read images
  - ornith
  - chat
hidden:            # not chat models (or benchmark-only): kept out of the model picker
  - embed
  - rerank
  - stt
  - stt-whisper
  - tts
  - tts-qwen
  - coder-tb
