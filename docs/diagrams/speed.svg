        <text x="853" y="128" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">44.0</text>
        <text x="628" y="128" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">llama.cpp</text>

        <text x="160" y="200" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Speed is Strata's win. Terminal-Bench at the same thinking level: Strata 17/19, llama.cpp 19/19.</text>
