        <text x="628" y="84" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Strata 0.2.7</text>

        <rect x="640" y="112" width="205" height="24" fill="#f5f5f5"/>
