<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 216" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="results-speed-title results-speed-desc" id="speed-root">
        <title id="results-speed-title">Strata vs llama.cpp speed on marvin</title>
        <desc id="results-speed-desc">Reading a 32K-token prompt: Strata 817 tokens per second, llama.cpp 315. Writing: Strata 55.5 tokens per second, llama.cpp 44.0.</desc>
  <defs>
      <style>#speed-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #speed-root { font-family: var(--font-sans); color: var(--color-ink); }
      #speed-root .diagram-container { width: 100%; overflow-x: auto; margin-bottom: 0.75rem; }
      #speed-root .note { font-size: 0.85rem; color: var(--color-muted); max-width: 60rem; margin-bottom: 0.75rem; line-height: 1.45; }
      #speed-root .source { font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-muted); margin-bottom: 1.5rem; }
      @media print {
#speed-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Panel titles -->
        <text x="160" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">READING A 32K PROMPT · TOK/S</text>
        <text x="640" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WRITING · TOK/S</text>

        <!-- Panel 1 grid: 0-1000 over x 160-440 -->
        <line x1="230" y1="56" x2="230" y2="152" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.08"/>
        <line x1="300" y1="56" x2="300" y2="152" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.08"/>
        <line x1="370" y1="56" x2="370" y2="152" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.08"/>
        <line x1="440" y1="56" x2="440" y2="152" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.08"/>
        <line x1="160" y1="52" x2="160" y2="152" stroke="#2d3142" stroke-width="1" stroke-opacity="0.25"/>
        <text x="160" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
