<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zaphod-cards-title zaphod-cards-desc" id="zaphod-cards-root">
        <title id="zaphod-cards-title">zaphod&#x27;s two graphics cards</title>
        <desc id="zaphod-cards-desc">Which models live on each of zaphod&#x27;s two R9700 cards: card 1 keeps embed and rerank loaded and runs coder or coder-tb; card 2 keeps the speech models loaded and runs one of coder-2, ornith, chat, north or flint; coder-long uses both cards.</desc>
        <defs>
      <style>#zaphod-cards-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #zaphod-cards-root .diagram-container { width: 100%; overflow-x: auto; }
      #zaphod-cards-root .source { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.7rem; color: #4f5d75; margin-top: 1rem; }
      @media print {
#zaphod-cards-root .diagram-container { overflow-x: visible; }
}</style>
