        <title id="settings-map-title">Where each setting lives</title>
        <desc id="settings-map-desc">Map of which file holds each kind of setting (Open WebUI, per-model options, agent tools, services, both machines&#x27; models, machine setup, model downloads) and the command to run after editing it; secrets live only in Proton Pass.</desc>
