      #settings-map-root .diagram-container { width: 100%; overflow-x: auto; }
      #settings-map-root .source { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.7rem; color: #4f5d75; margin-top: 1rem; }
      @media print {
#settings-map-root .diagram-container { overflow-x: visible; }
}</style>
