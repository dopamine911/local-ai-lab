<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="results-tooluse-title results-tooluse-desc" id="tool-use-root">
        <title id="results-tooluse-title">Tool-use score by model and server</title>
        <desc id="results-tooluse-desc">Horizontal bars of tool-use score out of 100: marvin with Strata at thinking medium 94.0, Ornith 92.0, marvin with llama.cpp 91.7, zaphod with Strata on one card 90.0, Flint 86.0.</desc>
  <defs>
      <style>#tool-use-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #tool-use-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tool-use-root .diagram-container { width: 100%; overflow-x: auto; margin-bottom: 0.75rem; }
      #tool-use-root .note { font-size: 0.85rem; color: var(--color-muted); max-width: 60rem; margin-bottom: 0.75rem; line-height: 1.45; }
      #tool-use-root .source { font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-muted); margin-bottom: 1.5rem; }
      @media print {
#tool-use-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Gridlines (0 is the axis line) -->
        <line x1="440" y1="56" x2="440" y2="304" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.08"/>
        <line x1="600" y1="56" x2="600" y2="304" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.08"/>
        <line x1="760" y1="56" x2="760" y2="304" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.08"/>
        <line x1="920" y1="56" x2="920" y2="304" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.08"/>
        <line x1="280" y1="48" x2="280" y2="304" stroke="#2d3142" stroke-width="1" stroke-opacity="0.25"/>

        <!-- Tick labels -->
        <text x="280" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
        <text x="440" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">25</text>
        <text x="600" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">50</text>
        <text x="760" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">75</text>
        <text x="920" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">100</text>
        <text x="600" y="336" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TOOL-USE SCORE (0-100)</text>

        <!-- Row 1 (focal): marvin, Strata, thinking medium, 94.0 -->
        <rect x="280" y="64" width="602" height="24" fill="#f5f5f5"/>
        <rect x="280" y="64" width="602" height="24" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.12"/>
        <text x="890" y="80" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace">94.0</text>
        <text x="268" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">marvin, Strata (thinking medium)</text>

        <!-- Row 2: Ornith, 92.0 -->
        <rect x="280" y="112" width="589" height="24" fill="#f5f5f5"/>
        <rect x="280" y="112" width="589" height="24" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.15"/>
        <text x="877" y="128" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">92.0</text>
        <text x="268" y="128" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">zaphod, Ornith 1.5</text>

        <!-- Row 3: marvin, llama.cpp, 91.7 -->
        <rect x="280" y="160" width="587" height="24" fill="#f5f5f5"/>
        <rect x="280" y="160" width="587" height="24" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.15"/>
        <text x="875" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">91.7</text>
        <text x="268" y="176" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">marvin, llama.cpp (Flash-Next)</text>

        <!-- Row 4: zaphod Strata one card, 90.0 -->
        <rect x="280" y="208" width="576" height="24" fill="#f5f5f5"/>
        <rect x="280" y="208" width="576" height="24" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.15"/>
        <text x="864" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">90.0</text>
        <text x="268" y="224" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">zaphod, Strata (Flash-Next, one card)</text>

        <!-- Row 5: Flint, 86.0 -->
        <rect x="280" y="256" width="550" height="24" fill="#f5f5f5"/>
        <rect x="280" y="256" width="550" height="24" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.15"/>
        <text x="838" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">86.0</text>
        <text x="268" y="272" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">zaphod, Flint</text>
      </svg>
