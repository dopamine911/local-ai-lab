        <text x="882" y="149" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PEER</text>
        <text x="956" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">llama-swap</text>
        <text x="956" y="182" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU uses 120 of 128 GB</text>
        <rect x="864" y="192" width="184" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="872" y="208" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">llama-swap</text>
        <text x="1040" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">267</text>
        <rect x="864" y="224" width="184" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="872" y="240" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">big (Flash-Next)</text>
        <text x="1040" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">128K</text>

        <!-- Callout -->
        <text x="40" y="368" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Every arrow travels over Tailscale. Nothing listens on the open internet; marvin/big shows up on zaphod as one more model.</text>

