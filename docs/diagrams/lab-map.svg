<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lab-map-title lab-map-desc" id="lab-map-root">
        <title id="lab-map-title">The lab: what runs where</title>
        <desc id="lab-map-desc">Laptops and phones reach Caddy on zaphod over Tailscale; Caddy serves the web services, which call zaphod's llama-swap, and zaphod's llama-swap forwards marvin/big requests to marvin's llama-swap as a peer.</desc>
        <defs>
      <style>#lab-map-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #lab-map-root { font-family: var(--font-sans); color: var(--color-ink); }
      #lab-map-root .diagram-container { width: 100%; overflow-x: auto; }
      #lab-map-root .source { font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-muted); margin-top: 1rem; }
      @media print {
#lab-map-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="lab-map-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="lab-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="lab-map-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#lab-map-dots)" opacity="0.55"/>

        <!-- Zones -->
        <rect x="40" y="40" width="208" height="300" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="56" y="44" width="72" height="12" fill="#f5f5f5"/>
        <text x="92" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR DEVICES</text>

        <rect x="280" y="40" width="528" height="300" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="296" y="44" width="128" height="12" fill="#f5f5f5"/>
        <text x="360" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ZAPHOD · 2× R9700 32 GB</text>

        <rect x="840" y="40" width="240" height="300" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="856" y="44" width="148" height="12" fill="#f5f5f5"/>
        <text x="930" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MARVIN · STRIX HALO 128 GB</text>

