        <text x="268" y="105" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>

        <rect x="420" y="170" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="179" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

        <rect x="524" y="242" width="48" height="12" rx="2" fill="#f5f5f5"/>
