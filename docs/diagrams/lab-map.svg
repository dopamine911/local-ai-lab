        <line x1="232" y1="114" x2="304" y2="114" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lab-map-arrow-link)"/>
        <line x1="412" y1="156" x2="412" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lab-map-arrow)"/>
        <line x1="520" y1="260" x2="576" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lab-map-arrow)"/>
        <line x1="784" y1="172" x2="856" y2="172" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#lab-map-arrow-link)"/>

