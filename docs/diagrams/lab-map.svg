        <text x="504" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">2.11.7</text>

        <!-- Node: web services (the hub) -->
        <rect x="304" y="196" width="216" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="196" width="216" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="312" y="204" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="328" y="213" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUB</text>
        <text x="412" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web services</text>
        <text x="412" y="246" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ Homepage, Beszel, MLflow</text>
        <rect x="312" y="252" width="200" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="320" y="268" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">open-webui</text>
        <text x="504" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v0.12.4</text>
        <rect x="312" y="284" width="200" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="320" y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">mcpjungle (tools)</text>
        <text x="504" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0.4.6</text>

        <!-- Node: zaphod llama-swap -->
        <rect x="576" y="132" width="208" height="156" rx="6" fill="#f5f5f5"/>
        <rect x="576" y="132" width="208" height="156" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="584" y="140" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="608" y="149" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODELS</text>
        <text x="680" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">llama-swap</text>
        <text x="680" y="182" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">llama.cpp b11870, Vulkan</text>
        <rect x="584" y="192" width="192" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
