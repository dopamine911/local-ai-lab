        <text x="768" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">267</text>
        <rect x="584" y="224" width="192" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="592" y="240" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">coder</text>
        <text x="768" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">card 1</text>
        <rect x="584" y="256" width="192" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="592" y="272" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">coder-2, ornith, chat</text>
        <text x="768" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">card 2</text>

        <!-- Node: marvin llama-swap (focal) -->
        <rect x="856" y="132" width="200" height="124" rx="6" fill="#f5f5f5"/>
        <rect x="856" y="132" width="200" height="124" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
