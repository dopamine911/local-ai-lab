        <line x1="840" y1="420" x2="868" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lab-map-arrow)"/>
        <text x="876" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inside one machine</text>
