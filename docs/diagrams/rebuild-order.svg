<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1168 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rebuild-order-title rebuild-order-desc" id="rebuild-order-root">
        <title id="rebuild-order-title">Rebuilding a machine, in order</title>
        <desc id="rebuild-order-desc">Eight rebuild steps in order: BIOS, Ubuntu install, host.sh, models.sh, secrets from Proton Pass, restore data, build and start services, web logins; each with what a good result looks like.</desc>
        <defs>
      <style>#rebuild-order-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #rebuild-order-root .diagram-container { width: 100%; overflow-x: auto; }
      #rebuild-order-root .source { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.7rem; color: #4f5d75; margin-top: 1rem; }
      @media print {
#rebuild-order-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="rebuild-order-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
          <marker id="rebuild-order-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#rebuild-order-dots)" opacity="0.55"/>
        <line x1="288" y1="136" x2="320" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rebuild-order-arrow)"/>
        <line x1="568" y1="136" x2="600" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rebuild-order-arrow)"/>
        <line x1="848" y1="136" x2="880" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rebuild-order-arrow)"/>
        <line x1="288" y1="328" x2="320" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rebuild-order-arrow)"/>
        <line x1="568" y1="328" x2="600" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rebuild-order-arrow)"/>
        <line x1="848" y1="328" x2="880" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rebuild-order-arrow)"/>
        <path d="M 1004,200 V 224 Q 1004,232 996,232 H 172 Q 164,232 164,240 V 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rebuild-order-arrow)"/>
        <rect x="40" y="72" width="248" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="248" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="48" y="80" width="54" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="75" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BY HAND</text>
        <text x="52" y="112" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">1. BIOS settings</text>
        <text x="52" y="130" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">zaphod: CSM Support Enabled</text>
        <text x="52" y="144" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">marvin: Performance, 512 MB UMA</text>
        <rect x="48" y="168" width="232" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="56" y="184" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Good: marvin busy at 130-140 W</text>
        <rect x="320" y="72" width="248" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="72" width="248" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="328" y="80" width="54" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="355" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BY HAND</text>
        <text x="332" y="112" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">2. Install Ubuntu 26.04</text>
        <text x="332" y="130" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">USB &#x27;UEFI:&#x27; entry, LVM full size</text>
        <text x="332" y="144" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">tick OpenSSH server</text>
        <rect x="328" y="168" width="232" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="336" y="184" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Good: df -h / shows the whole disk</text>
        <rect x="600" y="72" width="248" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="72" width="248" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="608" y="80" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="632" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
        <text x="612" y="112" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">3. Host setup, then reboot</text>
        <text x="612" y="130" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">sudo ~/homelab/setup/host.sh</text>
        <text x="612" y="144" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">Docker, Tailscale, SSH keys, time zone</text>
        <rect x="608" y="168" width="232" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="616" y="184" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Good: ssh between machines; docker ps</text>
        <rect x="880" y="72" width="248" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="880" y="72" width="248" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="888" y="80" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="912" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
        <text x="892" y="112" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">4. Models (takes hours)</text>
        <text x="892" y="130" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">setup/models.sh, inside tmux</text>
        <text x="892" y="144" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">pinned files, sha256 checked</text>
        <rect x="888" y="168" width="232" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="896" y="184" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Good: ends with MODELS-OK</text>
        <rect x="40" y="264" width="248" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="264" width="248" height="128" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="48" y="272" width="54" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="75" y="281" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BY HAND</text>
        <text x="52" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">5. Secrets</text>
        <text x="52" y="322" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">.env files from Proton Pass</text>
        <text x="52" y="336" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">hub/, zaphod/ and marvin/llama-swap/</text>
        <rect x="48" y="360" width="232" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="56" y="376" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Good: each .env in place, mode 600</text>
        <rect x="320" y="264" width="248" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="264" width="248" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="328" y="272" width="54" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="355" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BY HAND</text>
        <text x="332" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">6. Restore data (zaphod)</text>
        <text x="332" y="322" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">backup-to-marvin.sh list, then rsync</text>
        <text x="332" y="336" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">only if rebuilding; hub stopped</text>
        <rect x="328" y="360" width="232" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="336" y="376" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Good: hub/data filled again</text>
        <rect x="600" y="264" width="248" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="264" width="248" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="608" y="272" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="632" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
        <text x="612" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">7. Build and start</text>
        <text x="612" y="322" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">docker compose build, up -d</text>
        <text x="612" y="336" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">mcp/setup.sh, drift.sh, models.sh</text>
        <rect x="608" y="360" width="232" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="616" y="376" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Good: Health check passed; 0 differ</text>
        <rect x="880" y="264" width="248" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="880" y="264" width="248" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="888" y="272" width="54" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="915" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BY HAND</text>
        <text x="892" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">8. Web logins</text>
        <text x="892" y="322" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">Cloudflare DNS, Open WebUI admin</text>
        <text x="892" y="336" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">Beszel: add both machines</text>
        <rect x="888" y="360" width="232" height="24" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="896" y="376" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Good: pages open over Tailscale</text>
        <text x="40" y="424" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Details and exact commands: setup/REBUILD.md. A step still done by hand is a to-do for code.</text>
        <line x1="40" y1="444" x2="1128" y2="444" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Script does it</text>
        <rect x="260" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="280" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">By hand</text>
        <rect x="480" y="472" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="500" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Not in git: Proton Pass only</text>
        <rect x="700" y="472" width="20" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="728" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">What a good result looks like</text>

      </svg>
